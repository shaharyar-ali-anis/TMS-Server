events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    server_tokens off;

    # Portal uploads and any backup/restore endpoints
    client_max_body_size 50m;

    gzip              on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types
        application/javascript
        text/javascript
        text/css
        application/json
        image/svg+xml;

    # Required so SignalR's WebSocket upgrade survives the proxy hop
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream tms_web {
        server web:8080;
    }

    upstream tms_minio {
        server minio:9000;
    }

    # Plain HTTP -> HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server-cert.pem;
        ssl_certificate_key /etc/nginx/certs/server-key.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;

        # MinIO object passthrough. Makes event images same-origin.
        # Safe only because gateway emits unsigned, path-style, public-read URLs.
        location /hazen-tms/ {
            proxy_pass http://tms_minio/hazen-tms/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            add_header Cache-Control "public, max-age=86400";
        }

        # TMS portal, including the SignalR hub
        location / {
            proxy_pass http://tms_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_read_timeout 660s;
            proxy_send_timeout 660s;
            # Required for SignalR SSE and long-polling fallback transports
            proxy_buffering off;
        }
    }
}
